name: Execucao Diaria do Agente Financeiro

on:
  schedule:
    # Executa de segunda a sexta-feira às 18:00 (horário de Brasília / 21:00 UTC)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento para testar

jobs:
  executar-agente:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Limite de tempo de segurança para o job inteiro

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python no servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai yfinance

      - name: Executar o script main.py (com retentativas automáticas)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3      # Tempo máximo para cada execução do script
          max_attempts: 4         # Tenta até 4 vezes em caso de erro de servidor
          retry_wait_seconds: 15  # Espera 15 segundos de intervalo entre as tentativas
          command: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
